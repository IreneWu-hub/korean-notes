<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="bookCover" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="bookmark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
  </defs>

  <!-- Notebook Cover -->
  <rect x="18" y="14" width="84" height="92" rx="14" fill="url(#bookCover)" />
  
  <!-- Notebook Spine -->
  <rect x="18" y="14" width="14" height="92" rx="4" fill="#1e40af" />

  <!-- Bookmark Ribbon -->
  <path d="M74 14 v24 l7 -5 l7 5 v-24 Z" fill="url(#bookmark)" />

  <!-- Center Circle with Korean Taegeuk Symbol -->
  <circle cx="60" cy="62" r="23" fill="#ffffff" />
  <path d="M 60 41 A 21 21 0 0 1 60 83 A 10.5 10.5 0 0 1 60 62 A 10.5 10.5 0 0 0 60 41 Z" fill="#dc2626" />
  <path d="M 60 83 A 21 21 0 0 1 60 41 A 10.5 10.5 0 0 0 60 62 A 10.5 10.5 0 0 1 60 83 Z" fill="#2563eb" />
</svg>

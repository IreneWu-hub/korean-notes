<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="bookCover" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="bookmark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Notebook Shadow -->
  <rect x="22" y="16" width="76" height="88" rx="14" fill="#0f172a" opacity="0.08" />
  
  <!-- Notebook Cover -->
  <rect x="20" y="14" width="76" height="88" rx="12" fill="url(#bookCover)" filter="url(#shadow)" />
  
  <!-- Notebook Spine -->
  <rect x="20" y="14" width="12" height="88" rx="3" fill="#1e40af" />
  <line x1="32" y1="14" x2="32" y2="102" stroke="#1d4ed8" stroke-width="1.5" />

  <!-- Bookmark Ribbon -->
  <path d="M72 14 v24 l6 -4 l6 4 v-24 Z" fill="url(#bookmark)" />

  <!-- Center Circle with Korean Taegeuk Symbol -->
  <circle cx="58" cy="60" r="21" fill="#ffffff" />
  <path d="M 58 41 A 19 19 0 0 1 58 79 A 9.5 9.5 0 0 1 58 60 A 9.5 9.5 0 0 0 58 41 Z" fill="#dc2626" />
  <path d="M 58 79 A 19 19 0 0 1 58 41 A 9.5 9.5 0 0 0 58 60 A 9.5 9.5 0 0 1 58 79 Z" fill="#2563eb" />
</svg>